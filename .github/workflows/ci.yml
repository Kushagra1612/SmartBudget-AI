name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (migrations + pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_budget_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # A second, separate database from the test one -- used only to
      # prove the Alembic migration chain applies cleanly to a fresh
      # database, the way a real deploy would. pytest itself builds the
      # test database's schema straight from the models (see
      # tests/conftest.py), so this step and the test run below are
      # deliberately independent checks of two different things.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smart_budget_ai
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smart_budget_ai_test
      SECRET_KEY: test-secret-key-for-ci-only
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      # Not a real key. The test suite mocks every actual Gemini call
      # (see tests/conftest.py's mock_gemini fixture) -- this only needs
      # to be a non-empty string so the client can construct at all.
      GEMINI_API_KEY: test-gemini-key
      GEMINI_MODEL: gemini-3.5-flash-lite
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -U postgres; do sleep 1; done

      - name: Create the dev database (for the migration check)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres \
            -c "CREATE DATABASE smart_budget_ai;"

      - name: Verify Alembic migrations apply cleanly
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
